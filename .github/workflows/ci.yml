name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NEXT_TELEMETRY_DISABLED: "1"
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Code quality gate
        run: npm run codefactor:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          APP_SECRET: build-secret-placeholder-32-characters

  privacy-proxy:
    name: Privacy router SNI proxy (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/privacy-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The ubuntu-latest image ships a rustup-managed stable toolchain, so this
      # only has to guarantee the two components and the musl target are present.
      # Note that `rust:1-alpine` - what deploy/Dockerfile builds with - ships
      # NEITHER clippy nor rustfmt, which is why the lint gate lives here rather
      # than in the image build.
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/privacy-proxy/target
          key: privacy-proxy-${{ runner.os }}-${{ hashFiles('native/privacy-proxy/Cargo.lock') }}
          restore-keys: privacy-proxy-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      # `--all-targets` so the test files are linted too, and `-D warnings` so a
      # new clippy release cannot land a warning unnoticed. The parser's own
      # `deny(indexing_slicing, unwrap_used, panic, ...)` is enforced here.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the proptest suite: the "arbitrary bytes never panic the
      # parser" property is the reason this crate is Rust rather than C.
      - name: Tests
        run: cargo test --locked

      # musl-tools supplies musl-gcc, the linker for the static target. This is
      # the artefact deploy/Dockerfile ships to routers, so a musl-only break
      # must fail here rather than at image build time.
      - name: Static musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --release --target x86_64-unknown-linux-musl --locked

      - name: Verify the artefact is a static binary that runs
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/polysiem-privacy-proxy
          file "$BIN"
          # No dynamic interpreter: the whole point of musl here.
          if ldd "$BIN" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::proxy binary is dynamically linked"; ldd "$BIN"; exit 1
          fi
          "$BIN" --version
          "$BIN" --check tests/fixtures/reference.conf

      # The datapath test moves real bytes through the real binary with netfilter
      # genuinely redirecting into it, which needs NET_ADMIN to install the
      # REDIRECT rule and root to bind port 443 - hence a container rather than
      # the runner. It is the only test that covers `splice`, `SO_ORIGINAL_DST`,
      # `SO_BINDTODEVICE` and the killswitch at all.
      #
      # POLYSIEM_DATAPATH_TESTS=required turns the test's own self-skip into a
      # failure. Without it a missing capability would look exactly like a pass,
      # and the datapath would quietly stop being covered.
      - name: Datapath integration test (real sockets, nftables, splice)
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            -v "$PWD:/src:ro" \
            -e CARGO_TARGET_DIR=/tmp/target \
            -e POLYSIEM_DATAPATH_TESTS=required \
            -w /src rust:1-alpine \
            sh -c "apk add --no-cache musl-dev nftables iproute2 \
                   && cargo test --locked --test datapath -- --nocapture"

  shellcheck:
    name: Shellcheck deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./deploy

  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint --strict deploy/helm/polysiem

      - name: Render supported configurations
        shell: bash
        run: |
          helm template polysiem deploy/helm/polysiem --namespace polysiem > /dev/null
          helm template polysiem deploy/helm/polysiem --namespace polysiem \
            --set ingress.enabled=true \
            --set config.appUrl=https://polysiem.example.com > /dev/null
          helm template polysiem deploy/helm/polysiem --namespace polysiem \
            --set persistence.enabled=false \
            --set postgresql.persistence.enabled=false > /dev/null
          helm template polysiem deploy/helm/polysiem --namespace polysiem \
            --set postgresql.enabled=false \
            --set secrets.existingSecret=polysiem-external > /dev/null
          helm template polysiem deploy/helm/polysiem --namespace polysiem \
            --set service.type=LoadBalancer \
            --set service.loadBalancerIP=192.0.2.10 > /dev/null

  powershell:
    name: Validate PowerShell deployment scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem deploy -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
